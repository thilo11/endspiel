name: Release

on:
  # Manual-only — tag pushes do not auto-build releases. To cut a release:
  # 1. Push a v* tag (done locally, no CI fires).
  # 2. In the GitHub UI, Actions > Release > Run workflow, then enter the tag
  #    (e.g. v1.1.0) in the "tag" input. Both the build and the release are
  #    pinned to that tag regardless of which branch/ref the run is dispatched on.
  # Dry run: `gh workflow run release.yml -f tag=main -f publish=false` builds every
  # artifact (kept as workflow artifacts for 7 days) from any ref and publishes nothing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v1.1.0); any ref for a dry run"
        required: true
      publish:
        description: "Publish the GitHub release (off = dry run, artifacts only)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable x86-64-v2 baseline with runtime-dispatched AVX2/AVX-512
          # NNUE kernels. One artifact replaces the former v2/v3/v4 set.
          # Pinned, not ubuntu-latest: the build host's glibc sets the binary's
          # floor (v2.2.0 needs glibc >= 2.34); a silent image bump could raise it.
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: endspiel-linux-x64
            rustflags: "-C target-cpu=x86-64-v2"
            pgo: true
          - name: mac-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: endspiel-mac-arm64
            rustflags: "-C target-cpu=apple-m1"
            pgo: true
          - name: linux-arm64-pi5
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: endspiel-linux-arm64-pi5
            rustflags: "-C target-cpu=cortex-a76"
            lto: fat
            pgo: true
          - name: win-x64
            os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            artifact: endspiel-win-x64.exe
            rustflags: "-C target-cpu=x86-64-v2"
            pgo: true
          - name: win-arm64
            os: windows-2025-vs2026
            target: aarch64-pc-windows-msvc
            artifact: endspiel-win-arm64.exe
            rustflags: "-C target-cpu=generic"
            pgo: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
          components: ${{ matrix.pgo && 'llvm-tools-preview' || '' }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.name }}

      # --- Plain build path (no PGO) ----------------------------------------
      - name: Build (no PGO)
        if: ${{ !matrix.pgo }}
        run: cargo build --release --locked --bin endspiel --target ${{ matrix.target }}
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto || 'thin' }}
          RUSTFLAGS: ${{ matrix.rustflags }}

      # --- PGO build path ---------------------------------------------------
      # Two-stage build: instrumented binary generates profile data via
      # `endspiel bench 20`, then a final build consumes that profile. Depth 20
      # rather than the default 14: the short bench is dominated by startup
      # (magic tables, hash clear); +2.6% NPS for x86-64-v2 on positions outside
      # the bench (2026-11-12).
      - name: Build instrumented (PGO gen)
        if: matrix.pgo
        shell: bash
        run: cargo build --release --locked --bin endspiel --target ${{ matrix.target }}
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto || 'thin' }}
          RUSTFLAGS: "${{ matrix.rustflags }} -Cprofile-generate=${{ github.workspace }}/pgo-data"

      - name: Run PGO training workload
        if: matrix.pgo
        shell: bash
        run: |
          BIN="./target/${{ matrix.target }}/release/endspiel"
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          "$BIN" bench 20

      - name: Merge PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          SYSROOT="$(rustc --print sysroot)"
          LLVM_PROFDATA="$(find "$SYSROOT" -type f \( -name 'llvm-profdata' -o -name 'llvm-profdata.exe' \) | head -1)"
          if [[ -z "$LLVM_PROFDATA" ]]; then
            echo "llvm-profdata not found under $SYSROOT" >&2
            exit 1
          fi
          "$LLVM_PROFDATA" merge -o "${{ github.workspace }}/pgo-data/merged.profdata" "${{ github.workspace }}/pgo-data"

      - name: Build optimized (PGO use)
        if: matrix.pgo
        shell: bash
        run: cargo build --release --locked --bin endspiel --target ${{ matrix.target }}
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto || 'thin' }}
          RUSTFLAGS: "${{ matrix.rustflags }} -Cprofile-use=${{ github.workspace }}/pgo-data/merged.profdata"

      # --- Artifact rename + upload ----------------------------------------
      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/endspiel ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/endspiel.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # Android needs the NDK toolchain + cargo-ndk (for the bionic linker), so it
  # can't share the cross-platform matrix above. PGO (+15.7% bench NPS on a
  # Snapdragon 8 Elite): scripts/build-android.sh runs the training bench of a
  # static instrumented build under qemu-aarch64.
  # The release artifact is the OEX engine APK; the bare NDK binary is only an
  # intermediate it wraps.
  build-android:
    name: android-arm64
    # This image includes Android platform 34, build-tools 34.0.0, and the NDK,
    # so the APK build needs no additional SDK provisioning.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install qemu-user (PGO training run)
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      # ubuntu-24.04 ships several NDKs; ANDROID_NDK_HOME is the image default
      # (r27), so point it at ANDROID_NDK_LATEST_HOME (r30): the static PGO
      # training binary needs r30's 64-byte TLS alignment, and r30 is what the
      # tablet measurements used. minSdk 24; portable ARMv8-A baseline, fat LTO,
      # PGO. The output at target/aarch64-linux-android/release/endspiel feeds
      # the APK below.
      - name: Build (Android NDK)
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-android.sh

      # ── Wrap the binary in an Open Exchange (OEX) engine APK ──
      # Installs like a normal app on a non-rooted device; chess GUIs
      # (DroidFish, Chess for Android) auto-discover it. See android/oex/.
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "9.9.1"

      - name: Build OEX engine APK
        env:
          VERSION_NAME: ${{ inputs.tag }}
        run: |
          # Derive a clean versionName/versionCode from the tag (e.g. v1.2.1).
          VER="${VERSION_NAME#v}"
          MA=$(echo "$VER" | cut -d. -f1 | tr -dc 0-9)
          MI=$(echo "$VER" | cut -d. -f2 | tr -dc 0-9)
          PA=$(echo "$VER" | cut -d. -f3 | tr -dc 0-9)
          VCODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          # A dry run from a branch (tag=main) has no version digits; AGP needs >= 1.
          [ "$VCODE" -gt 0 ] || VCODE=1
          VERSION_NAME="$VER" VERSION_CODE="$VCODE" scripts/build-android-apk.sh

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=android/oex/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Signing with the repository keystore (stable upgrade signature)."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ks.jks
            STOREPASS="$ANDROID_KEYSTORE_PASSWORD"; ALIAS="$ANDROID_KEY_ALIAS"; KEYPASS="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets set — signing with an ephemeral key."
            echo "::warning::Users must uninstall any previous build before installing this one."
            keytool -genkeypair -keystore ks.jks -alias endspiel -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass changeit -keypass changeit -dname "CN=Endspiel, O=thilo.dev"
            STOREPASS=changeit; ALIAS=endspiel; KEYPASS=changeit
          fi
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$STOREPASS" \
            --ks-key-alias "$ALIAS" --key-pass "pass:$KEYPASS" \
            --out endspiel-android-arm64.apk aligned.apk
          "$BT/apksigner" verify --print-certs endspiel-android-arm64.apk
          rm -f ks.jks aligned.apk

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: endspiel-android-arm64-apk
          path: endspiel-android-arm64.apk
          retention-days: 7

  release:
    needs: [build, build-android]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: artifacts/*
