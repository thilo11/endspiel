name: Release

on:
  # Manual-only — tag pushes do not auto-build releases. To cut a release:
  # 1. Push a v* tag (done locally, no CI fires).
  # 2. In the GitHub UI, Actions > Release > Run workflow, then enter the tag
  #    (e.g. v1.1.0) in the "tag" input. Both the build and the release are
  #    pinned to that tag regardless of which branch/ref the run is dispatched on.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v1.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-v3
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: endspiel-linux-x64-v3
            rustflags: "-C target-cpu=x86-64-v3"
            pgo: true
          - name: linux-x64-v4
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: endspiel-linux-x64-v4
            rustflags: "-C target-cpu=x86-64-v4"
            pgo: false
          # Lower tier for x86-64 CPUs without AVX2 (the default is v3/AVX2).
          # v2 = SSE4.2 + POPCNT — covers pre-2013 mainstream and recent low-end
          # Intel (Gemini/Jasper Lake). PGO works: the CI runner can run a
          # lower-feature binary to generate the profile.
          - name: linux-x64-v2
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: endspiel-linux-x64-v2
            rustflags: "-C target-cpu=x86-64-v2"
            pgo: true
          - name: mac-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: endspiel-mac-arm64
            rustflags: "-C target-cpu=apple-m1"
            pgo: true
          - name: linux-arm64-pi5
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: endspiel-linux-arm64-pi5
            rustflags: "-C target-cpu=cortex-a76"
            pgo: true
          - name: win-x64-v3
            os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            artifact: endspiel-win-x64-v3.exe
            rustflags: "-C target-cpu=x86-64-v3"
            pgo: true
          - name: win-x64-v4
            os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            artifact: endspiel-win-x64-v4.exe
            rustflags: "-C target-cpu=x86-64-v4"
            pgo: false
          - name: win-x64-v2
            os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            artifact: endspiel-win-x64-v2.exe
            rustflags: "-C target-cpu=x86-64-v2"
            pgo: true
          - name: win-arm64
            os: windows-2025-vs2026
            target: aarch64-pc-windows-msvc
            artifact: endspiel-win-arm64.exe
            rustflags: "-C target-cpu=generic"
            pgo: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
          components: ${{ matrix.pgo && 'llvm-tools-preview' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # --- Plain build path (no PGO) ----------------------------------------
      - name: Build (no PGO)
        if: ${{ !matrix.pgo }}
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # --- PGO build path ---------------------------------------------------
      # Two-stage build: instrumented binary generates profile data via
      # `endspiel bench`, then a final build consumes that profile.
      - name: Build instrumented (PGO gen)
        if: matrix.pgo
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "${{ matrix.rustflags }} -Cprofile-generate=${{ github.workspace }}/pgo-data"

      - name: Run PGO training workload
        if: matrix.pgo
        shell: bash
        run: |
          BIN="./target/${{ matrix.target }}/release/endspiel"
          if [[ "${{ runner.os }}" == "Windows" ]]; then BIN="${BIN}.exe"; fi
          "$BIN" bench

      - name: Merge PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          SYSROOT="$(rustc --print sysroot)"
          LLVM_PROFDATA="$(find "$SYSROOT" -type f \( -name 'llvm-profdata' -o -name 'llvm-profdata.exe' \) | head -1)"
          if [[ -z "$LLVM_PROFDATA" ]]; then
            echo "llvm-profdata not found under $SYSROOT" >&2
            exit 1
          fi
          "$LLVM_PROFDATA" merge -o "${{ github.workspace }}/pgo-data/merged.profdata" "${{ github.workspace }}/pgo-data"

      - name: Build optimized (PGO use)
        if: matrix.pgo
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "${{ matrix.rustflags }} -Cprofile-use=${{ github.workspace }}/pgo-data/merged.profdata"

      # --- Artifact rename + upload ----------------------------------------
      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/endspiel ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/endspiel.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # Android needs the NDK toolchain + cargo-ndk (for the bionic linker), so it
  # can't share the cross-platform matrix above. No PGO: the cross-compiled
  # binary can't run the bench workload on the x86 host. The release artifact is
  # the OEX engine APK; the bare NDK binary is only an intermediate it wraps.
  build-android:
    name: android-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ubuntu-latest ships an NDK and exports ANDROID_NDK_LATEST_HOME, which
      # cargo-ndk auto-detects. minSdk 24; portable ARMv8-A baseline. The output
      # at target/aarch64-linux-android/release/endspiel feeds the APK below.
      - name: Build (Android NDK)
        run: cargo ndk --target arm64-v8a --platform 24 build --release --bin endspiel
        env:
          RUSTFLAGS: "-C target-cpu=generic"

      # ── Wrap the binary in an Open Exchange (OEX) engine APK ──
      # Installs like a normal app on a non-rooted device; chess GUIs
      # (DroidFish, Chess for Android) auto-discover it. See android/oex/.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build OEX engine APK
        env:
          VERSION_NAME: ${{ inputs.tag }}
        run: |
          # Derive a clean versionName/versionCode from the tag (e.g. v1.2.1).
          VER="${VERSION_NAME#v}"
          MA=$(echo "$VER" | cut -d. -f1 | tr -dc 0-9)
          MI=$(echo "$VER" | cut -d. -f2 | tr -dc 0-9)
          PA=$(echo "$VER" | cut -d. -f3 | tr -dc 0-9)
          VCODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          VERSION_NAME="$VER" VERSION_CODE="$VCODE" scripts/build-android-apk.sh

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=android/oex/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Signing with the repository keystore (stable upgrade signature)."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ks.jks
            STOREPASS="$ANDROID_KEYSTORE_PASSWORD"; ALIAS="$ANDROID_KEY_ALIAS"; KEYPASS="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets set — signing with an ephemeral key."
            echo "::warning::Users must uninstall any previous build before installing this one."
            keytool -genkeypair -keystore ks.jks -alias endspiel -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass changeit -keypass changeit -dname "CN=Endspiel, O=thilo.dev"
            STOREPASS=changeit; ALIAS=endspiel; KEYPASS=changeit
          fi
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$STOREPASS" \
            --ks-key-alias "$ALIAS" --key-pass "pass:$KEYPASS" \
            --out endspiel-android-arm64.apk aligned.apk
          "$BT/apksigner" verify --print-certs endspiel-android-arm64.apk
          rm -f ks.jks aligned.apk

      - uses: actions/upload-artifact@v7
        with:
          name: endspiel-android-arm64-apk
          path: endspiel-android-arm64.apk
          retention-days: 7

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          # Opt into Node.js 24; silences the Node 20 deprecation warning until
          # the action ships a Node 24 release.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: artifacts/*
