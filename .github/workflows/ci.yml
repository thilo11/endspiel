name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace -- -D warnings

      - run: cargo test --workspace

  # The debug tests above cannot cover behaviour that depends on the engine
  # actually being fast: a debug build spends ~8s in search spin-up before its
  # first node, so it never observes a stop flag promptly. Tests gated on
  # `#[cfg_attr(debug_assertions, ignore)]` — currently the forced-move ponderhit
  # guard — only run here. One OS is enough; the behaviour is not platform-specific.
  release-tests:
    name: release tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --release --workspace
