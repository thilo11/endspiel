[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.6.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97.1"

[workspace.dependencies]
chess-common = { path = "crates/chess-common" }
chess-core = { path = "crates/chess-core" }
chess-engine = { path = "crates/chess-engine" }
chess-nnue = { path = "crates/chess-nnue" }
chess-tuner = { path = "crates/chess-tuner" }
chess-uci = { path = "crates/chess-uci" }
bulletformat = "1.8.0"
log = "0.4.33"
env_logger = "0.11.11"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.19"

[package]
name = "endspiel-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "endspiel"
path = "src/main.rs"

[patch.crates-io]
pyrrhic-rs = { git = "https://github.com/Algorhythm-sxv/pyrrhic-rs", rev = "961c059" }

[profile.release]
lto = "thin"
codegen-units = 1
# Search threads are guarded with `catch_unwind` and return a legal fallback
# move on an unexpected panic. Keep unwind tables in production so those
# guards can recover instead of terminating the whole engine process.
panic = "unwind"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[dependencies]
chess-common.workspace = true
chess-core.workspace = true
chess-engine.workspace = true
chess-uci.workspace = true
log.workspace = true
env_logger.workspace = true
